<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor · DB-Detector - RENACYT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
/* ── Variables globales de diseño ─────────────────────────────────────────────
   Todos los colores y tamaños del sistema de diseño están aquí centralizados.
   Cambiar una variable afecta a todos los componentes que la usen. */
:root {
  --bg:          #0d1117;  /* fondo principal (GitHub dark) */
  --surface:     #161b22;  /* superficie de tarjetas y sidebar */
  --surface-2:   #1c2128;  /* superficie elevada (inputs, badges) */
  --border:      #30363d;  /* bordes principales */
  --border-sub:  #21262d;  /* bordes secundarios */
  --text:        #e6edf3;  /* texto principal */
  --text-sec:    #c9d1d9;  /* texto secundario */
  --muted:       #7d8590;  /* texto apagado (metadata) */
  --accent:      #2f81f7;  /* color de acento (azul GitHub) */
  --accent-hi:   #388bfd;  /* acento hover */
  --running:     #3fb950;  /* estado RUNNING (verde) */
  --stopped:     #6e7681;  /* estado STOPPED (gris) */
  --starting:    #e3b341;  /* estado STARTING (amarillo) */
  --error:       #f85149;  /* estado ERROR (rojo) */
  --sidebar:     248px;    /* ancho fijo del sidebar */
  --radius:      6px;
  --radius-md:   8px;
  --radius-lg:   12px;
}
*  { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; height: 100vh; overflow: hidden; font-size: 14px;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── SIDEBAR ──────────────────────────────────────────────────────────────────
   Panel izquierdo fijo con la lista de proyectos registrados.
   Contiene: logo/marca, botones de acción (agregar/escanear), y la lista de proyectos. */
#sidebar {
  width: var(--sidebar); min-width: var(--sidebar);
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}

#sidebar-brand {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--border);
}
#sidebar-brand .brand-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
}
#sidebar-brand .brand-icon {
  width: 28px; height: 28px; border-radius: var(--radius);
  background: var(--surface-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--accent); flex-shrink: 0;
}
#sidebar-brand .brand-text { font-weight: 700; font-size: 13px; letter-spacing: .04em; }
#sidebar-brand .brand-sub  { font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.sidebar-actions {
  display: flex; gap: 6px;
}
.sidebar-actions .btn-sb {
  flex: 1; padding: 6px 8px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-sec); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: background .15s, border-color .15s;
}
.sidebar-actions .btn-sb:hover { background: var(--bg); border-color: var(--accent); color: var(--text); }
.sidebar-actions .btn-sb.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.sidebar-actions .btn-sb.primary:hover { background: var(--accent-hi); }

#project-list { flex: 1; overflow-y: auto; padding: 6px 0; }

/* ── Panel de procesos del sistema (java/postgres/mysql/mongo/redis vivos) ── */
#sidebar-procs { border-top: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; max-height: 280px; }
.sidebar-procs-header {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 9px 14px; font-size: 12px; color: var(--text-sec); flex-shrink: 0;
}
.sidebar-procs-header:hover { background: rgba(255,255,255,.04); }
.proc-count {
  font-size: 10px; color: var(--muted); background: var(--surface-2);
  padding: 1px 7px; border-radius: 10px;
}
#proc-list-body { overflow-y: auto; padding: 0 14px 10px; }
.proc-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; font-size: 12px; border-top: 1px solid var(--border-sub);
}
.proc-row:first-child { border-top: none; }
.proc-row .proc-name { flex: 1; min-width: 0; color: var(--text-sec); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proc-row .proc-pid { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
.proc-row .proc-mb { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; width: 56px; text-align: right; flex-shrink: 0; }
.proc-row .proc-kill {
  background: none; border: none; color: var(--muted); cursor: pointer;
  padding: 2px 5px; font-size: 11px; flex-shrink: 0; transition: color .12s;
}
.proc-row .proc-kill:hover { color: var(--error); }

.proj-item {
  padding: 9px 14px; cursor: pointer;
  border-left: 3px solid transparent;
  display: flex; align-items: center; gap: 9px;
  transition: background .12s;
}
.proj-item:hover { background: rgba(255,255,255,.04); }
.proj-item.active { background: rgba(47,129,247,.1); border-left-color: var(--accent); }

.proj-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  transition: box-shadow .3s;
}
.proj-dot.running { box-shadow: 0 0 0 3px rgba(63,185,80,.2); animation: pulse 2s infinite; }
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 2px rgba(63,185,80,.2); }
  50%      { box-shadow: 0 0 0 5px rgba(63,185,80,.05); }
}

.proj-info { flex: 1; min-width: 0; }
.proj-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-meta { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.proj-db-badge {
  font-size: 10px; padding: 1px 6px; border-radius: 10px;
  background: rgba(255,255,255,.07); color: var(--muted);
  text-transform: lowercase; letter-spacing: .03em;
}

/* ── MAIN ─────────────────────────────────────────────────────────────────────
   Panel principal derecho: toolbar con botones de control + área de contenido.
   Cambia de contenido según el proyecto seleccionado en el sidebar. */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

#toolbar {
  padding: 10px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.btn {
  padding: 6px 13px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); cursor: pointer; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .12s, border-color .12s;
  white-space: nowrap;
}
.btn:hover   { background: var(--surface-2); border-color: #484f57; }
.btn:active  { opacity: .8; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.btn.danger  { border-color: transparent; color: var(--error); }
.btn.danger:hover { background: rgba(248,81,73,.12); border-color: rgba(248,81,73,.3); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.spacer { flex: 1; }
a.legacy-link { color: var(--muted); font-size: 12px; text-decoration: none; }
a.legacy-link:hover { color: var(--text); }

#content { flex: 1; overflow-y: auto; padding: 28px 28px 40px; }

/* ─────────────────────── LIST TABLE ─────────────────────── */
.section-title {
  font-size: 11px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .08em; margin-bottom: 14px; font-weight: 600;
}
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  text-align: left; padding: 8px 12px;
  font-size: 11px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .06em; border-bottom: 1px solid var(--border);
  font-weight: 600;
}
.data-table td {
  padding: 10px 12px; border-bottom: 1px solid var(--border-sub);
  font-size: 13px; color: var(--text-sec);
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr.data-row:nth-child(even) td { background: rgba(255,255,255,.012); }
.data-table tbody tr:hover td { background: rgba(255,255,255,.025); color: var(--text); }
.data-table .col-center { text-align: center; }
.data-table .col-actions { width: 180px; }

/* ─────────────────────── BADGES ─────────────────────── */
.badge {
  padding: 2px 9px; border-radius: 20px;
  font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 5px;
}
.badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.badge-RUNNING  { background: rgba(63,185,80,.12);  color: var(--running); }
.badge-STOPPED  { background: rgba(110,118,129,.12); color: var(--stopped); }
.badge-STARTING { background: rgba(227,179,65,.12);  color: var(--starting); }
.badge-ERROR    { background: rgba(248,81,73,.12);   color: var(--error); }

/* ─────────────────────── TABS ─────────────────────── */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; gap: 2px; }
.tab {
  padding: 9px 18px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; font-size: 13px; font-weight: 500;
  transition: color .12s; margin-bottom: -1px;
}
.tab:hover  { color: var(--text-sec); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }

/* ─────────────────────── INFO CARDS ─────────────────────── */
.card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
@media (max-width: 900px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 14px 16px;
  position: relative; overflow: hidden;
  transition: border-color .15s;
}
.card:hover { border-color: #484f57; }
.card-icon {
  width: 30px; height: 30px; border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; margin-bottom: 10px; opacity: .9;
}
.card-label { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .05em; }
.card-value { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.card-accent-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px; opacity: .6;
}

/* ─────────────────────── CREDENTIALS ─────────────────────── */
.creds-section { margin-bottom: 28px; }
.creds-table {
  width: 100%; border-collapse: collapse;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  overflow: hidden;
}
.creds-table th {
  text-align: left; padding: 8px 16px;
  font-size: 11px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .06em; border-bottom: 1px solid var(--border);
  font-weight: 600; background: var(--surface-2);
}
.creds-table td {
  padding: 10px 16px; border-bottom: 1px solid var(--border-sub); font-size: 13px;
}
.creds-table tr:last-child td { border-bottom: none; }
.creds-table .cred-key   { color: var(--muted); width: 140px; font-weight: 500; }
.creds-table .cred-val   { color: var(--text); font-family: ui-monospace, "SF Mono", Consolas, monospace; }
.creds-table .cred-val a { color: var(--accent); text-decoration: none; }
.creds-table .cred-val a:hover { text-decoration: underline; }
.creds-table .cred-copy {
  width: 32px; text-align: right;
}
.copy-btn {
  background: none; border: none; color: var(--muted); cursor: pointer;
  padding: 3px 6px; border-radius: 4px; font-size: 11px;
  opacity: 0; transition: opacity .12s, color .12s;
}
.creds-table tr:hover .copy-btn { opacity: 1; }
.copy-btn:hover { color: var(--accent); }

/* ─────────────────────── ACTION BAR ─────────────────────── */
.action-bar { display: flex; gap: 8px; align-items: center; }

/* ─────────────────────── QUERY AREA ─────────────────────── */
.query-label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; font-weight: 500; }
select.styled {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 7px 10px; border-radius: var(--radius);
  font-size: 13px; outline: none;
  transition: border-color .12s;
}
select.styled:focus { border-color: var(--accent); }
#query-editor {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); padding: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 13px; resize: vertical; min-height: 90px; outline: none;
  transition: border-color .12s;
}
#query-editor:focus { border-color: var(--accent); }
.result-wrap { overflow-x: auto; margin-top: 16px; }
.pager {
  margin-top: 12px; display: flex; gap: 8px;
  align-items: center; font-size: 12px; color: var(--muted);
}

/* ─────────────────────── LOGS ─────────────────────── */
#log-area {
  background: #0a0c10; border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 14px 16px; font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 12px; height: 420px; overflow-y: auto;
  white-space: pre-wrap; word-break: break-all;
  color: #c9d1d9; line-height: 1.5;
}

/* ─────────────────────── MODAL ─────────────────────── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.75); z-index: 100;
  align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); width: 500px; padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.modal h3 { font-size: 16px; margin-bottom: 6px; }
.modal .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
.modal input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); padding: 9px 12px; font-size: 13px;
  outline: none; transition: border-color .12s;
}
.modal input:focus { border-color: var(--accent); }
#preview-box {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; margin-top: 12px; font-size: 12px;
  color: var(--muted); display: none; line-height: 1.7;
}
.modal-actions { margin-top: 20px; display: flex; gap: 8px; justify-content: flex-end; }

/* ─────────────────────── TOAST ─────────────────────── */
#toast {
  position: fixed; bottom: 24px; right: 24px;
  background: #1c2128; border: 1px solid var(--border);
  color: var(--text); padding: 10px 18px; border-radius: var(--radius-md);
  font-size: 13px; display: none; z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
  max-width: 400px;
}
#toast.error { border-color: rgba(248,81,73,.4); background: rgba(248,81,73,.1); color: var(--error); }
#toast.ok    { border-color: rgba(63,185,80,.4);  background: rgba(63,185,80,.1);  color: var(--running); }

/* ─────────────────────── EMPTY STATE ─────────────────────── */
.empty-state {
  text-align: center; padding: 80px 20px; color: var(--muted);
}
.empty-state i { font-size: 40px; margin-bottom: 16px; opacity: .3; display: block; }
.empty-state p { font-size: 14px; }

/* ─────────────────────── DETAIL HEADER ─────────────────────── */
.detail-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
  padding-bottom: 16px; border-bottom: 1px solid var(--border);
}
.detail-title { font-weight: 700; font-size: 18px; flex: 1; }

/* misc */
.gap { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div id="sidebar-brand">
    <div class="brand-row">
      <div class="brand-icon"><i class="fa fa-database"></i></div>
      <div>
        <div class="brand-text">DB-Detector</div>
        <div class="brand-sub">Gestor · <span id="mode-badge" style="font-weight:600">—</span></div>
      </div>
    </div>
    <div class="sidebar-actions">
      <button class="btn-sb primary" onclick="openModal()"><i class="fa fa-plus"></i> Agregar</button>
    </div>
  </div>
  <div id="project-list"></div>
  <div id="sidebar-procs"></div>
</aside>

<!-- Main -->
<div id="main">
  <div id="toolbar">
    <button class="btn primary" onclick="upAll()"><i class="fa fa-play"></i> Levantar todos</button>
    <button class="btn"         onclick="downAll()"><i class="fa fa-stop"></i> Bajar todos</button>
    <div class="spacer"></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <button class="btn" onclick="freeRam()" title="Libera working set de los procesos (como Mem Reduct)"><i class="fa fa-broom"></i> Liberar RAM</button>
    </div>
  </div>
  <div id="content">
    <div id="panel-list"></div>
    <div id="panel-detail" style="display:none"></div>
  </div>
</div>

<!-- Modal: agregar proyecto -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Agregar Proyecto</h3>
    <div class="add-tabs" style="display:flex;gap:6px;margin:4px 0 12px">
      <button class="btn add-tab" data-tab="local" onclick="addTab('local')">Ruta local</button>
      <button class="btn add-tab" data-tab="git"   onclick="addTab('git')">Git URL</button>
      <button class="btn add-tab" data-tab="zip"   onclick="addTab('zip')">Subir ZIP</button>
    </div>

    <div id="add-local" class="add-pane">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input id="modal-path" type="text" placeholder="/ruta/al/proyecto" style="flex:1">
        <button class="btn" title="Examinar" onclick="pickFolder('modal-path')"><i class="fa fa-folder-open"></i></button>
      </div>
      <div id="preview-box"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" id="btn-confirm" onclick="confirmAdd()">Confirmar</button>
      </div>
    </div>

    <div id="add-git" class="add-pane" style="display:none">
      <input id="git-url" type="text" placeholder="https://github.com/usuario/repo" style="margin-bottom:8px">
      <input id="git-ref" type="text" placeholder="rama (opcional)" style="margin-bottom:8px">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input id="git-dest" type="text" placeholder="Carpeta destino (opcional, default: interna del gestor)" style="flex:1">
        <button class="btn" title="Examinar" onclick="pickFolder('git-dest')"><i class="fa fa-folder-open"></i></button>
      </div>
      <div id="git-msg" style="font-size:12px;color:var(--muted)"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="confirmGit()"><i class="fa fa-code-branch"></i> Clonar y agregar</button>
      </div>
    </div>

    <div id="add-zip" class="add-pane" style="display:none">
      <p class="modal-sub">Sube un .zip con el proyecto.</p>
      <input id="zip-file" type="file" accept=".zip" style="margin-bottom:8px">
      <div id="zip-msg" style="font-size:12px;color:var(--muted)"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="confirmZip()"><i class="fa fa-file-zipper"></i> Subir y agregar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-group">
  <div class="modal" id="modal-group-box" style="width:520px"></div>
</div>

<div id="toast"></div>

<script>
// ── DB metadata ────────────────────────────────────────────────────────────
const DB_META = {
  postgresql: { color: '#4479ba', icon: 'fa-database', label: 'PostgreSQL' },
  mysql:      { color: '#f5a623', icon: 'fa-database', label: 'MySQL'      },
  mariadb:    { color: '#c0765a', icon: 'fa-database', label: 'MariaDB'    },
  mongodb:    { color: '#47a248', icon: 'fa-leaf',     label: 'MongoDB'    },
  redis:      { color: '#dc382d', icon: 'fa-bolt',     label: 'Redis'      },
};
function dbMeta(type) {
  return DB_META[type?.toLowerCase()] || { color: 'var(--muted)', icon: 'fa-database', label: type || '—' };
}

// ── State ──────────────────────────────────────────────────────────────────
const state = { projects: [], selected: null, tab: 'info', queryRows: [], queryPage: 0, collapsedGroups: new Set(), dbProcesses: [], procPanelCollapsed: true };

// ── API ────────────────────────────────────────────────────────────────────
async function fetchAPI(method, endpoint, body) {
  try {
    const opts = { method, headers: {'Content-Type':'application/json'} };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(endpoint, opts);
    if (r.status === 401) { window.location = '/login'; return { error: 'No autenticado' }; }
    return r.json();
  } catch(e) {
    return { error: e.message };
  }
}

// ── Modo del manager (docker / portable) ───────────────────────────────────
async function loadManagerBadge() {
  const el = document.getElementById('mode-badge');
  if (!el) return;
  const m = await fetchAPI('GET', '/api/manager');
  if (!m || m.error || !m.mode) return;
  const portable = m.mode === 'portable';
  el.textContent = portable ? 'Portable' : 'Docker';
  el.title = portable
    ? 'Sin Docker: las BD corren como procesos con binarios descargables'
    : 'Docker disponible: las BD corren en contenedores';
  el.style.color = portable ? 'var(--starting)' : 'var(--accent)';
}

function toast(msg, type = 'error', dur = 4000) {
  const el = document.getElementById('toast');
  el.className = type;
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', dur);
}

// ── Load ───────────────────────────────────────────────────────────────────
async function loadProjects() {
  const data = await fetchAPI('GET', '/api/projects');
  if (!Array.isArray(data)) return;
  state.projects = data;
  renderSidebar();
  renderList();
  if (state.selected) {
    const found = data.find(p => p.name === state.selected);
    if (found) renderDetail(found);

}

// ── Sidebar ────────────────────────────────────────────────────────────────
function statusColor(s) {
  return { RUNNING: '#3fb950', STOPPED: '#6e7681', STARTING: '#e3b341', ERROR: '#f85149' }[s] || '#6e7681';
}

function sidebarItem(p) {
  const m = dbMeta(p.db_type);
  const isRunning = p.status === 'RUNNING';
  return `
    <div class="proj-item ${p.name === state.selected ? 'active' : ''}" onclick="selectProject('${esc(p.name)}')">
      <div class="proj-dot ${isRunning ? 'running' : ''}" style="background:${statusColor(p.status)}"></div>
      <div class="proj-info">
        <div class="proj-name">${esc(p.name)}</div>
        <div class="proj-meta">
          ${p.role ? `<span class="proj-db-badge">${esc(p.role)}</span>` : ''}
          ${p.db_type ? `<span class="proj-db-badge" style="color:${m.color}">${m.label}</span>` : ''}
        </div>
      </div>
    </div>`;
}

function toggleSidebarGroup(name) {
  if (state.collapsedGroups.has(name)) state.collapsedGroups.delete(name);
  else state.collapsedGroups.add(name);
  renderSidebar();
}

function sidebarGroupHeader(key, label, count, members, onDelete) {
  const collapsed = state.collapsedGroups.has(key);
  const anyRunning = members.some(m => m.status === 'RUNNING');
  return `
    <div class="proj-item" onclick="toggleSidebarGroup('${escAttr(key)}')">
      <i class="fa fa-chevron-${collapsed ? 'right' : 'down'}" style="width:10px;font-size:10px;color:var(--muted)"></i>
      <div class="proj-dot ${anyRunning ? 'running' : ''}" style="background:${anyRunning ? statusColor('RUNNING') : statusColor('STOPPED')}"></div>
      <div class="proj-info">
        <div class="proj-name"><i class="fa fa-folder" style="margin-right:5px;color:var(--muted)"></i>${esc(label)}</div>
        <div class="proj-meta"><span class="proj-db-badge">${count} servicios</span></div>
      </div>
      <i class="fa fa-trash" title="Eliminar grupo entero" style="color:var(--muted);padding:4px" onclick="event.stopPropagation(); ${onDelete}"></i>
    </div>`;
}

// Envuelve el contenido de un nodo (hijos de un grupo/root) en un contenedor
// con línea guía a la izquierda, para que se vea claramente que ese bloque
// "pertenece" al nodo de arriba — mismo patrón de árbol que un explorador de
// archivos, en vez de headers y filas sueltas al mismo nivel visual.
function sidebarNest(innerHtml) {
  if (!innerHtml) return '';
  return `<div style="margin-left:17px;padding-left:9px;border-left:1px solid var(--border)">${innerHtml}</div>`;
}

function renderSidebar() {
  const el = document.getElementById('project-list');
  if (!state.projects.length) {
    el.innerHTML = '<p style="padding:20px 14px;font-size:12px;color:var(--muted)">Sin proyectos todavía.</p>';
    return;
  }
  // Varios proyectos a la vez: los agrupados (mono-repo escaneado) van bajo un
  // único nodo colapsable con el nombre del proyecto, no sueltos uno por uno —
  // si no, la barra lateral se vuelve ilegible apenas orquestás más de un repo.
  // Si además vienen de un "Escanear" sobre una carpeta con varias sub-carpetas
  // de servicios (ej. infra/ y services/ dentro de un mismo mono-repo), esos
  // sub-grupos se anidan a su vez bajo un nodo con el nombre de la carpeta raíz
  // escaneada (root_group), para que la jerarquía real del repo se vea en la UI.
  const standalone = state.projects.filter(p => !p.group_name && !p.root_group);
  const flatGroups = {};   // group_name sin root_group (grupos sueltos de siempre)
  const rootGroups  = {};  // root_group -> { direct: [...], subgroups: {group_name: [...]} }

  state.projects.forEach(p => {
    if (p.root_group) {
      const rg = (rootGroups[p.root_group] = rootGroups[p.root_group] || { direct: [], subgroups: {} });
      if (p.group_name) (rg.subgroups[p.group_name] = rg.subgroups[p.group_name] || []).push(p);
      else rg.direct.push(p);
    } else if (p.group_name) {
      (flatGroups[p.group_name] = flatGroups[p.group_name] || []).push(p);
    }
  });

  let html = standalone.map(p => sidebarItem(p)).join('');

  html += Object.entries(flatGroups).map(([name, members]) =>
    sidebarGroupHeader(name, name, members.length, members, `removeGroup('${escAttr(name)}')`) +
    (state.collapsedGroups.has(name) ? '' : sidebarNest(members.map(p => sidebarItem(p)).join('')))
  ).join('');

  html += Object.entries(rootGroups).map(([rootName, rg]) => {
    const rootKey = 'root:' + rootName;
    const allMembers = [...rg.direct, ...Object.values(rg.subgroups).flat()];
    const rootCollapsed = state.collapsedGroups.has(rootKey);
    let inner = '';
    if (!rootCollapsed) {
      inner += rg.direct.map(p => sidebarItem(p)).join('');
      inner += Object.entries(rg.subgroups).map(([name, members]) =>
        sidebarGroupHeader(name, name, members.length, members, `removeGroup('${escAttr(name)}')`) +
        (state.collapsedGroups.has(name) ? '' : sidebarNest(members.map(p => sidebarItem(p)).join('')))
      ).join('');
    }
    return sidebarGroupHeader(rootKey, rootName, allMembers.length, allMembers,
      `removeRootGroup('${escAttr(rootName)}')`) + sidebarNest(inner);
  }).join('');

  el.innerHTML = html;
}

// ── Panel de procesos del sistema ─────────────────────────────────────────
async function loadDbProcesses() {
  const data = await fetchAPI('GET', '/api/system/processes');
  if (!data || !data.ok) return;
  state.dbProcesses = data.processes || [];
  renderProcPanel();
}

function toggleProcPanel() {
  state.procPanelCollapsed = !state.procPanelCollapsed;
  renderProcPanel();
}

function renderProcPanel() {
  const el = document.getElementById('sidebar-procs');
  if (!el) return;
  const procs = state.dbProcesses;
  const collapsed = state.procPanelCollapsed;
  el.innerHTML = `
    <div class="sidebar-procs-header" onclick="toggleProcPanel()">
      <i class="fa fa-chevron-${collapsed ? 'right' : 'down'}" style="width:10px;font-size:10px;color:var(--muted)"></i>
      <i class="fa fa-microchip" style="color:var(--muted)"></i>
      <span style="flex:1">Procesos del sistema</span>
      <span class="proc-count">${procs.length}</span>
    </div>
    ${!collapsed ? `
    <div id="proc-list-body">
      ${procs.length ? `
        <div style="display:flex;justify-content:flex-end;padding:2px 0 8px">
          <button class="btn-sb danger" style="flex:none;padding:3px 9px;font-size:11px" onclick="killAllDbProcesses()"><i class="fa fa-skull"></i> Matar todos</button>
        </div>
        ${procs.map(p => `
          <div class="proc-row">
            <span class="proc-name" title="${esc(p.name)} (PID ${p.pid})">${esc(p.name)}</span>
            <span class="proc-pid">#${p.pid}</span>
            <span class="proc-mb">${p.mb} MB</span>
            <button class="proc-kill" title="Matar PID ${p.pid}" onclick="killDbProcess(${p.pid})"><i class="fa fa-xmark"></i></button>
          </div>`).join('')}
      ` : `<p style="color:var(--muted);font-size:12px;padding:4px 0 8px">Sin procesos java/postgres/mysql/mongo/redis corriendo.</p>`}
    </div>` : ''}`;
}

async function killDbProcess(pid) {
  const data = await fetchAPI('POST', `/api/system/kill-pid/${pid}`);
  if (data && data.error) { toast(`No se pudo matar PID ${pid}: ${data.error}`, 'error'); return; }
  toast(`Proceso ${pid} matado`, 'ok', 1500);
  await loadDbProcesses();
  await loadProjects();
}

async function killAllDbProcesses() {
  const procs = state.dbProcesses;
  if (!procs.length) return;
  if (!confirm(`Matar los ${procs.length} procesos listados (java/postgres/mysql/mongo/redis)?\nEsto puede tumbar servicios que tengas corriendo ahora.`)) return;
  for (const p of procs) {
    await fetchAPI('POST', `/api/system/kill-pid/${p.pid}`);
  }
  toast('Procesos matados', 'ok', 2000);
  await loadDbProcesses();
  await loadProjects();
}

// ── List panel ─────────────────────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('panel-list');
  if (state.selected) { el.style.display = 'none'; return; }
  el.style.display = '';
  if (!state.projects.length) {
    el.innerHTML = `<div class="empty-state"><i class="fa fa-database"></i><p>Sin proyectos. Usa <strong>Agregar</strong> para registrar uno.</p></div>`;
    return;
  }
  // Separar sueltos de agrupados (mono-repo: varios servicios bajo un mismo
  // group_name, resultado de "Escanear" sobre una carpeta con backend+frontend
  // o microservicios). Los agrupados van en bloques propios con su cabecera.
  // Si varios de esos bloques comparten root_group (ej. infra/ y services/
  // dentro del mismo repo escaneado), se anidan bajo una cabecera con el
  // nombre de la carpeta raíz en vez de aparecer como bloques sueltos.
  const ungrouped = state.projects.filter(p => !p.group_name && !p.root_group);
  const flatGroups = {};
  const rootGroups = {};
  state.projects.forEach(p => {
    if (p.root_group && p.group_name) {
      const rg = (rootGroups[p.root_group] = rootGroups[p.root_group] || {});
      (rg[p.group_name] = rg[p.group_name] || []).push(p);
    } else if (p.root_group) {
      const rg = (rootGroups[p.root_group] = rootGroups[p.root_group] || {});
      (rg['_'] = rg['_'] || []).push(p);
    } else if (p.group_name) {
      (flatGroups[p.group_name] = flatGroups[p.group_name] || []).push(p);
    }
  });

  const row = (p, indent = 0) => {
    const m = dbMeta(p.db_type);
    return `
      <tr class="data-row">
        <td style="${indent ? `padding-left:${12 + indent * 22}px;border-left:1px solid var(--border)` : ''}">
          <a href="#" onclick="selectProject('${esc(p.name)}');return false" style="color:var(--accent);font-weight:500">${esc(p.name)}</a>
          ${p.role ? `<span style="color:var(--muted);font-size:11px;margin-left:6px">${p.role}</span>` : ''}
        </td>
        <td><span style="color:${m.color}">${m.label}</span></td>
        <td style="color:var(--text-sec)">${p.framework || '—'}</td>
        <td>${(p.links && p.links.length)
              ? (p.status === 'RUNNING'
                  ? p.links.map(l => `<a href="${l.url}/" target="_blank" style="color:var(--accent);margin-right:8px;white-space:nowrap">${esc(l.name)}</a>`).join('')
                  : p.links.map(l => esc(l.name)).join(', '))
              : (p.app_port ? (p.status === 'RUNNING' ? `<a href="http://localhost:${p.app_port}/" target="_blank" style="color:var(--accent)">:${p.app_port}</a>` : `:${p.app_port}`) : '—')}</td>
        <td class="col-center" style="font-variant-numeric:tabular-nums">${p.db_port || '—'}</td>
        <td class="col-center"><span class="badge badge-${p.status}">${p.status}</span></td>
        <td class="col-actions">
          <div class="gap">
            <button class="btn" title="Up"      onclick="projectAction('${esc(p.name)}','up')"><i class="fa fa-play"></i></button>
            <button class="btn" title="Down"    onclick="projectAction('${esc(p.name)}','down')"><i class="fa fa-stop"></i></button>
            <button class="btn" title="Restart" onclick="projectAction('${esc(p.name)}','restart')"><i class="fa fa-rotate-right"></i></button>
            ${p.framework === 'springboot' ? `<button class="btn ${p.ram_limit_mb ? 'primary' : ''}" title="${p.ram_limit_mb ? `RAM limitada a ${p.ram_limit_mb}MB — click para quitar` : 'Limitar RAM a 512MB (requiere reiniciar el servicio)'}" onclick="toggleRamLimit('${esc(p.name)}', ${p.ram_limit_mb || 0})"><i class="fa fa-memory"></i></button>` : ''}
            <button class="btn danger" title="Remove" onclick="removeProject('${esc(p.name)}')"><i class="fa fa-trash"></i></button>
          </div>
        </td>
      </tr>`;
  };

  const groupBlock = (name, members, indent = 0) => {
    const be = members.filter(p => p.role === 'backend').length;
    const fe = members.filter(p => p.role === 'frontend').length;
    const infra = members.filter(p => p.role === 'infra').length;
    const pad = 12 + indent * 22;
    const springMembers = members.filter(p => p.framework === 'springboot');
    const anyLimited = springMembers.some(p => p.ram_limit_mb);
    return `
      <tr>
        <td colspan="7" style="background:var(--bg);padding:10px 12px 10px ${pad}px;border-top:1px solid var(--border);${indent ? 'border-left:1px solid var(--border)' : ''}">
          <div style="display:flex;align-items:center;gap:10px">
            <i class="fa fa-folder-tree" style="color:var(--accent)"></i>
            <strong>${esc(name)}</strong>
            <span style="color:var(--muted);font-size:12px">${be} backend · ${fe} frontend${infra ? ` · ${infra} infra` : ''}</span>
            <div class="spacer"></div>
            ${springMembers.length ? `<button class="btn ${anyLimited ? 'primary' : ''}" title="${anyLimited ? 'Quitar límite de RAM a todo el grupo' : 'Limitar RAM a 512MB en todo el grupo (requiere reiniciar)'}" onclick="toggleGroupRamLimit('${escAttr(name)}', ${anyLimited})"><i class="fa fa-memory"></i></button>` : ''}
            <button class="btn primary" onclick="startGroup('${escAttr(name)}')"><i class="fa fa-play"></i> Iniciar grupo</button>
            <button class="btn" onclick="restartGroup('${escAttr(name)}')"><i class="fa fa-rotate-right"></i> Reiniciar grupo</button>
            <button class="btn" onclick="stopGroup('${escAttr(name)}')"><i class="fa fa-stop"></i> Parar grupo</button>
            <button class="btn danger" title="Eliminar grupo entero" onclick="removeGroup('${escAttr(name)}')"><i class="fa fa-trash"></i></button>
          </div>
        </td>
      </tr>
      ${members.map(p => row(p, indent + 1)).join('')}`;
  };

  const rootBlock = (rootName, sub) => {
    const direct = sub['_'] || [];
    const allMembers = Object.values(sub).flat();
    const be = allMembers.filter(p => p.role === 'backend').length;
    const fe = allMembers.filter(p => p.role === 'frontend').length;
    const infra = allMembers.filter(p => p.role === 'infra').length;
    const springMembers = allMembers.filter(p => p.framework === 'springboot');
    const anyLimited = springMembers.some(p => p.ram_limit_mb);
    return `
      <tr>
        <td colspan="7" style="background:var(--bg);padding:12px;border-top:2px solid var(--accent)">
          <div style="display:flex;align-items:center;gap:10px">
            <i class="fa fa-folder-tree" style="color:var(--accent)"></i>
            <strong style="font-size:14px">${esc(rootName)}</strong>
            <span style="color:var(--muted);font-size:12px">${allMembers.length} servicios · ${be} backend · ${fe} frontend${infra ? ` · ${infra} infra` : ''}</span>
            <div class="spacer"></div>
            ${springMembers.length ? `<button class="btn ${anyLimited ? 'primary' : ''}" title="${anyLimited ? 'Quitar límite de RAM a todo el repo' : 'Limitar RAM a 512MB en todo el repo (requiere reiniciar)'}" onclick="toggleGroupRamLimit('${escAttr(rootName)}', ${anyLimited})"><i class="fa fa-memory"></i></button>` : ''}
            <button class="btn primary" onclick="startGroup('${escAttr(rootName)}')"><i class="fa fa-play"></i> Iniciar todo</button>
            <button class="btn" onclick="restartGroup('${escAttr(rootName)}')"><i class="fa fa-rotate-right"></i> Reiniciar todo</button>
            <button class="btn" onclick="stopGroup('${escAttr(rootName)}')"><i class="fa fa-stop"></i> Parar todo</button>
            <button class="btn danger" title="Eliminar repo entero" onclick="removeRootGroup('${escAttr(rootName)}')"><i class="fa fa-trash"></i></button>
          </div>
        </td>
      </tr>
      ${direct.map(p => row(p, 1)).join('')}
      ${Object.entries(sub).filter(([name]) => name !== '_')
        .map(([name, members]) => groupBlock(name, members, 1)).join('')}`;
  };

  el.innerHTML = `
    <p class="section-title">Proyectos (${state.projects.length})</p>
    <table class="data-table">
      <thead><tr>
        <th>Nombre</th><th>BD</th><th>Framework</th>
        <th>App URL</th><th class="col-center">Puerto DB</th><th class="col-center">Estado</th><th class="col-actions"></th>
      </tr></thead>
      <tbody>
      ${ungrouped.map(row).join('')}
      ${Object.entries(flatGroups).map(([name, members]) => groupBlock(name, members)).join('')}
      ${Object.entries(rootGroups).map(([name, sub]) => rootBlock(name, sub)).join('')}
      </tbody>
    </table>`;
}

// ── Detail panel ───────────────────────────────────────────────────────────
function selectProject(name) {
  state.selected = name;
  state.tab = 'info';
  document.getElementById('panel-list').style.display = 'none';
  document.getElementById('panel-detail').style.display = '';
  renderSidebar();
  const p = state.projects.find(x => x.name === name);
  if (p) renderDetail(p);
}

function backToList() {
  state.selected = null;
  document.getElementById('panel-detail').style.display = 'none';
  document.getElementById('panel-list').style.display = '';
  renderSidebar();
}

function renderDetail(p) {
  const el = document.getElementById('panel-detail');
  const tabs = ['info','queries','logs'];
  const tabLabels = { info: 'Información', queries: 'Queries', logs: 'Logs' };
  let body = '';
  if (state.tab === 'info')    body = renderInfo(p);
  else if (state.tab === 'queries') body = renderQueries(p);
  else if (state.tab === 'logs')    body = renderLogs(p);

  el.innerHTML = `
    <div class="detail-header">
      <button class="btn" onclick="backToList()" style="padding:6px 10px"><i class="fa fa-arrow-left"></i></button>
      <span class="detail-title">${esc(p.name)}</span>
      <span class="badge badge-${p.status}">${p.status}</span>
    </div>
    <div class="tabs">
      ${tabs.map(t => `<div class="tab ${state.tab===t?'active':''}" onclick="switchTab('${t}','${esc(p.name)}')">${tabLabels[t]}</div>`).join('')}
    </div>
    ${body}`;

  if (state.tab === 'logs') {
    const la = document.getElementById('log-area');
    if (la) la.scrollTop = la.scrollHeight;
  }
}

function switchTab(tab, name) {
  state.tab = tab;
  const p = state.projects.find(x => x.name === name);
  if (p) renderDetail(p);
  if (tab === 'logs')    loadLogs(name);
  if (tab === 'queries') loadTables(name);
}

// ── Info tab ───────────────────────────────────────────────────────────────
function renderInfo(p) {
  const creds = p.credentials || {};
  const m = dbMeta(p.db_type);
  const dbLabel = p.db_type || (p.framework === 'frontend' ? 'Frontend' : (p.role === 'infra' ? 'Infra' : '—'));

  const cards = [
    { label: 'Base de datos', value: m.label || dbLabel, icon: m.icon, color: m.color },
    { label: 'Framework',     value: p.framework || '—', icon: 'fa-code',    color: '#7d8590' },
    { label: 'Puerto App',    value: p.app_port  || '—', icon: 'fa-globe',   color: '#7d8590' },
    { label: 'Puerto DB',     value: p.db_port   || '—', icon: 'fa-plug',    color: '#7d8590' },
  ];

  // build credential rows
  const credRows = [];
  if (p.links && p.links.length && p.status === 'RUNNING') {
    p.links.forEach(l => {
      const u = `${l.url}/`;
      credRows.push({ key: `url ${l.name}`, val: `<a href="${u}" target="_blank">${u}</a>`, raw: u });
    });
  } else if (p.app_port && p.status === 'RUNNING') {
    const appUrl = `http://localhost:${p.app_port}/`;
    credRows.push({ key: 'url app', val: `<a href="${appUrl}" target="_blank">${appUrl}</a>`, raw: appUrl });
  }
  ['database','user','password'].forEach(k => {
    if (creds[k] != null) credRows.push({ key: k, val: String(creds[k]), raw: String(creds[k]) });
  });

  return `
    <div class="card-grid">
      ${cards.map(c => `
        <div class="card">
          <div class="card-icon" style="background:${c.color}22;color:${c.color}"><i class="fa ${c.icon}"></i></div>
          <div class="card-label">${c.label}</div>
          <div class="card-value">${c.value}</div>
          <div class="card-accent-bar" style="background:${c.color}"></div>
        </div>`).join('')}
    </div>
    ${credRows.length ? `
    <div class="creds-section">
      <p class="section-title">Credenciales</p>
      <table class="creds-table">
        <thead><tr><th>Campo</th><th>Valor</th><th></th></tr></thead>
        <tbody>
          ${credRows.map(r => `
            <tr>
              <td class="cred-key">${r.key}</td>
              <td class="cred-val">${r.val}</td>
              <td class="cred-copy"><button class="copy-btn" title="Copiar" onclick="copyText('${escAttr(r.raw)}')"><i class="fa fa-copy"></i></button></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>` : ''}
    <div class="action-bar">
      <button class="btn primary" onclick="projectAction('${esc(p.name)}','up')"><i class="fa fa-play"></i> Up</button>
      <button class="btn"         onclick="projectAction('${esc(p.name)}','down')"><i class="fa fa-stop"></i> Down</button>
      <button class="btn"         onclick="projectAction('${esc(p.name)}','restart')"><i class="fa fa-rotate-right"></i> Restart</button>
      <button class="btn"         onclick="refreshProject('${esc(p.name)}')" title="git pull"><i class="fa fa-download"></i> Actualizar</button>
      <div style="flex:1"></div>
      <button class="btn danger"  onclick="removeProject('${esc(p.name)}')"><i class="fa fa-trash"></i> Remove</button>
    </div>`;
}

// ── Queries tab ────────────────────────────────────────────────────────────
let _currentTables = [];

function renderQueries(p) {
  const PAGE_SIZE = 50;
  const rows = state.queryRows;
  const page = state.queryPage;
  const slice = rows.slice(page * PAGE_SIZE, (page+1) * PAGE_SIZE);
  const cols  = rows.length ? Object.keys(rows[0] || {}) : [];

  let resultHTML = '';
  if (rows.length) {
    resultHTML = `
      <div class="result-wrap">
        <table class="data-table">
          <thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>${slice.map(r=>`<tr>${cols.map(c=>`<td>${r[c]??''}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="pager">
        ${page*PAGE_SIZE+1}–${Math.min((page+1)*PAGE_SIZE,rows.length)} de ${rows.length}
        <button class="btn" onclick="changePage(-1)" ${page===0?'disabled':''}>&#8592;</button>
        <button class="btn" onclick="changePage(1)"  ${(page+1)*PAGE_SIZE>=rows.length?'disabled':''}>&#8594;</button>
        <button class="btn" onclick="exportQuery('${esc(p.name)}','json')"><i class="fa fa-download"></i> JSON</button>
        <button class="btn" onclick="exportQuery('${esc(p.name)}','csv')"><i class="fa fa-download"></i> CSV</button>
      </div>`;
  }

  return `
    <div style="margin-bottom:12px">
      <label class="query-label">Tabla / Colección</label>
      <select id="table-sel" class="styled" onchange="fillQuery()">
        <option value="">— seleccionar —</option>
        ${_currentTables.map(t=>`<option value="${escAttr(t.name)}">${esc(t.name)}${t.size?' ('+t.size+')':''}</option>`).join('')}
      </select>
    </div>
    <textarea id="query-editor" placeholder="SELECT * FROM tabla LIMIT 100"></textarea>
    <div class="gap" style="margin-top:8px">
      <button class="btn primary" onclick="runQuery('${esc(p.name)}')"><i class="fa fa-play"></i> Ejecutar</button>
    </div>
    ${resultHTML}`;
}

async function loadTables(name) {
  const data = await fetchAPI('GET', `/api/projects/${name}/tables`);
  _currentTables = data.tables || [];
  const p = state.projects.find(x => x.name === name);
  if (p && state.tab === 'queries') renderDetail(p);
}

function fillQuery() {
  const sel = document.getElementById('table-sel');
  const ed  = document.getElementById('query-editor');
  if (sel && ed && sel.value) ed.value = `SELECT * FROM "${sel.value}" LIMIT 100`;
}

function changePage(dir) {
  state.queryPage = Math.max(0, state.queryPage + dir);
  const p = state.projects.find(x => x.name === state.selected);
  if (p) renderDetail(p);
}

async function runQuery(name) {
  const q = document.getElementById('query-editor')?.value?.trim();
  if (!q) return;
  const data = await fetchAPI('POST', `/api/projects/${name}/query`, { sql: q });
  if (data.error) { toast(data.error); return; }
  const cols = data.columns || [];
  state.queryRows = (data.rows || []).map(r => Object.fromEntries(cols.map((c,i)=>[c, r[i]])));
  state.queryPage = 0;
  const p = state.projects.find(x => x.name === name);
  if (p) renderDetail(p);
}

async function exportQuery(name, fmt) {
  const sel = document.getElementById('table-sel')?.value;
  if (!sel) { toast('Selecciona una tabla primero'); return; }
  const resp = await fetch(`/api/projects/${name}/export`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ table: sel, format: fmt })
  });
  if (!resp.ok) { toast('Error al exportar'); return; }
  const blob = await resp.blob();
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `${sel}.${fmt}`; a.click();
  URL.revokeObjectURL(url);
}

// ── Logs tab ───────────────────────────────────────────────────────────────
function renderLogs(p) {
  return `
    <div class="gap" style="margin-bottom:12px">
      <button class="btn" onclick="loadLogs('${esc(p.name)}')"><i class="fa fa-rotate-right"></i> Actualizar</button>
      <button class="btn" onclick="clearLogs()"><i class="fa fa-trash"></i> Limpiar</button>
      <button class="btn" onclick="copyLogs()"><i class="fa fa-copy"></i> Copiar todo</button>
    </div>
    <div id="log-area"></div>`;
}

async function loadLogs(name) {
  const data = await fetchAPI('GET', `/api/projects/${name}/logs?lines=200`);
  const el   = document.getElementById('log-area');
  if (!el) return;
  el.textContent = (data.logs || []).join('\n');
  el.scrollTop = el.scrollHeight;
}

function clearLogs() { const el = document.getElementById('log-area'); if (el) el.textContent = ''; }
function copyLogs()  { const el = document.getElementById('log-area'); if (el) navigator.clipboard.writeText(el.textContent); }

// ── Project actions ────────────────────────────────────────────────────────
async function projectAction(name, action) {
  const data = await fetchAPI('POST', `/api/projects/${name}/${action}`);
  if (data.port_conflict) {
    await handlePortConflict(data.port_conflict, () => projectAction(name, action));
  } else if (data.error) {
    toast(data.error, 'error');
  } else if (action === 'up') {
    toast('Servicio levantado', 'ok', 2500);
  }
  await loadProjects();
}

// Puerto ocupado al arrancar: quién lo tiene (otro de nuestros proyectos, o
// un proceso suelto del sistema) y, si el usuario confirma, lo baja/mata y
// reintenta la acción original.
async function handlePortConflict(conflict, retry) {
  const who = conflict.project
    ? `el proyecto '${conflict.project}'`
    : (conflict.process ? `el proceso '${conflict.process}' (PID ${conflict.pid})` : `el PID ${conflict.pid}`);
  if (!confirm(`El puerto ${conflict.port} ya está ocupado por ${who}.\n¿Lo bajo y reintento?`)) return;
  if (conflict.project) {
    await fetchAPI('POST', `/api/projects/${conflict.project}/down`);
  } else if (conflict.pid) {
    const r = await fetchAPI('POST', `/api/system/kill-pid/${conflict.pid}`);
    if (r.error) { toast(`No se pudo matar el proceso: ${r.error}`, 'error'); return; }
  }
  await retry();
}

async function pickFolder(inputId) {
  const data = await fetchAPI('POST', '/api/pick-folder');
  if (data.error) { toast(data.error, 'error'); return; }
  if (data.path) document.getElementById(inputId).value = data.path;
}

async function removeProject(name) {
  if (!confirm(`Eliminar '${name}' del gestor?\n(Si fue clonado por Git/ZIP, se borra su copia; si es una ruta tuya, no se toca)`)) return;
  await fetchAPI('DELETE', `/api/projects/${name}`);
  if (state.selected === name) backToList();
  await loadProjects();
}

async function removeGroup(name) {
  const members = state.projects.filter(p => p.group_name === name);
  if (!confirm(`Eliminar el grupo '${name}' completo (${members.length} servicios)?\n(Si fue clonado por Git/ZIP, se borra toda la carpeta del proyecto; si es una ruta tuya, no se toca)`)) return;
  const data = await fetchAPI('DELETE', `/api/groups/${encodeURIComponent(name)}`);
  if (data.error) toast(data.error, 'error');
  if (members.some(p => p.name === state.selected)) backToList();
  await loadProjects();
}

async function removeRootGroup(rootName) {
  const members = state.projects.filter(p => p.root_group === rootName);
  if (!confirm(`Eliminar '${rootName}' completo (${members.length} servicios, todos sus sub-grupos incluidos)?\n(Si fue clonado por Git/ZIP, se borra toda la carpeta del proyecto; si es una ruta tuya, no se toca)`)) return;
  const data = await fetchAPI('DELETE', `/api/root-groups/${encodeURIComponent(rootName)}`);
  if (data.error) toast(data.error, 'error');
  if (members.some(p => p.name === state.selected)) backToList();
  await loadProjects();
}

async function toggleRamLimit(name, currentMb) {
  const mb = currentMb ? null : 512;
  const data = await fetchAPI('PUT', `/api/projects/${encodeURIComponent(name)}/ram-limit`, { mb });
  if (data.error) { toast(data.error, 'error'); return; }
  toast(mb ? `RAM limitada a ${mb}MB — reinicia el servicio para aplicar` : 'Límite de RAM quitado — reinicia para aplicar', 'ok', 3500);
  await loadProjects();
}

async function toggleGroupRamLimit(group, currentlyLimited) {
  const mb = currentlyLimited ? null : 512;
  const data = await fetchAPI('PUT', `/api/groups/${encodeURIComponent(group)}/ram-limit`, { mb });
  if (data.error) { toast(data.error, 'error'); return; }
  toast(mb ? `RAM limitada a ${mb}MB en el grupo — reinicia para aplicar` : 'Límite de RAM quitado del grupo — reinicia para aplicar', 'ok', 3500);
  await loadProjects();
}

async function refreshProject(name) {
  toast('Actualizando…', 'ok', 1500);
  const data = await fetchAPI('POST', `/api/projects/${name}/refresh`);
  if (data.error) toast(data.error, 'error');
  else toast('Proyecto actualizado', 'ok', 2500);
  await loadProjects();
}

async function upAll() {
  const data = await fetchAPI('POST', '/api/projects/up-all');
  if (data.errors?.length) toast(`Errores: ${data.errors.map(e=>e.name).join(', ')}`);
  else toast('Todos los servicios levantados', 'ok', 2500);
  await loadProjects();
}

async function downAll() {
  await fetchAPI('POST', '/api/projects/down-all');
  await loadProjects();
}

async function freeRam() {
  toast('Liberando RAM…', 'ok', 2000);
  const data = await fetchAPI('POST', '/api/system/free-ram');
  if (!data.ok) { toast(data.error || 'No se pudo liberar RAM', 'error'); return; }
  const extras = [
    data.working_set_emptied && 'working set',
    data.system_file_cache_flushed && 'cache de archivos',
    data.standby_list_low_priority_purged && 'standby list',
    data.volume_cache_flushed && 'cache de volúmenes',
    data.registry_cache_flushed && 'registro',
    data.memory_lists_combined && 'páginas combinadas',
  ].filter(Boolean);
  const adminMsg = data.is_admin ? '' : ' ⚠️ NO corre como Administrador';
  const extraMsg = extras.length ? ` (${extras.join(', ')})` : ' (sin privilegios de Administrador: no se aplicó nada)';
  toast(`RAM liberada: ${data.free_mb_before} MB → ${data.free_mb_after} MB${extraMsg}${adminMsg}`, 'ok', 6000);
}

// ── Modal: agregar ─────────────────────────────────────────────────────────
function openModal() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-path').value = '';
  document.getElementById('preview-box').style.display = 'none';
  document.getElementById('preview-box').innerHTML = '';
  document.getElementById('git-url').value = '';
  document.getElementById('git-ref').value = '';
  document.getElementById('git-dest').value = '';
  document.getElementById('git-msg').textContent = '';
  document.getElementById('zip-file').value = '';
  document.getElementById('zip-msg').textContent = '';
  addTab('git');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function addTab(which) {
  ['local','git','zip'].forEach(t => {
    document.getElementById('add-' + t).style.display = (t === which) ? 'block' : 'none';
    const b = document.querySelector(`.add-tab[data-tab="${t}"]`);
    if (b) b.classList.toggle('primary', t === which);
  });
}

async function confirmGit() {
  const url = document.getElementById('git-url').value.trim();
  const ref = document.getElementById('git-ref').value.trim();
  const dest_folder = document.getElementById('git-dest').value.trim();
  if (!url) return;
  const msg = document.getElementById('git-msg');
  msg.textContent = 'Clonando…';
  const data = await fetchAPI('POST', '/api/projects/git', { url, ref: ref || undefined, dest_folder: dest_folder || undefined });
  if (data.error) { msg.textContent = ''; toast(data.error); return; }
  closeModal();
  await loadProjects();
}

async function confirmZip() {
  const f = document.getElementById('zip-file').files[0];
  if (!f) return;
  const msg = document.getElementById('zip-msg');
  msg.textContent = 'Subiendo…';
  const fd = new FormData();
  fd.append('file', f);
  try {
    const r = await fetch('/api/projects/zip', { method: 'POST', body: fd });
    if (r.status === 401) { window.location = '/login'; return; }
    const data = await r.json();
    if (data.error) { msg.textContent = ''; toast(data.error); return; }
    closeModal();
    await loadProjects();
  } catch (e) { msg.textContent = ''; toast(e.message); }
}

async function confirmAdd() {
  const path = document.getElementById('modal-path').value.trim();
  if (!path) return;
  const pb = document.getElementById('preview-box');
  pb.style.display = 'block'; pb.textContent = 'Detectando…';
  const data = await fetchAPI('POST', '/api/projects', { path });
  if (data.error) { pb.textContent = `Error: ${data.error}`; return; }

  if (data.added) {
    // Monorepo: varios servicios detectados adentro, agrupados.
    const added   = data.added.map(p => p.name).join(', ') || 'ninguno';
    const skipped = (data.skipped || []).length;
    const errors  = (data.errors  || []).length;
    pb.innerHTML = `
      <div style="color:var(--running);margin-bottom:4px;font-size:12px"><strong>Agregados (${data.added.length}):</strong> ${added}</div>
      ${skipped ? `<div style="color:var(--muted);font-size:12px">Omitidos: ${skipped}</div>` : ''}
      ${errors  ? `<div style="color:var(--error);font-size:12px">Errores: ${(data.errors||[]).map(e=>e.name).join(', ')}</div>` : ''}`;
  } else {
    // Proyecto único.
    const m = dbMeta(data.db_type);
    pb.innerHTML = `
      <span style="color:${m.color};font-weight:600">${m.label}</span> &nbsp;·&nbsp;
      <span style="color:var(--text-sec)">${data.framework || '—'}</span>`;
  }
  await loadProjects();
  closeModal();
}

// ── Grupos (mono-repo: backend/frontend separados) ────────────────────────
async function startGroup(group) {
  toast(`Levantando '${group}'…`, 'ok', 2500);
  const data = await fetchAPI('POST', `/api/groups/${encodeURIComponent(group)}/up`);
  await loadProjects();
  showGroupResult(group, data);
}

async function stopGroup(group) {
  toast(`Bajando '${group}'…`, 'ok', 2500);
  const data = await fetchAPI('POST', `/api/groups/${encodeURIComponent(group)}/down`);
  await loadProjects();
  if (data.error) { toast(data.error, 'error'); return; }
  const failed = (data.results || []).filter(r => !r.ok);
  toast(failed.length ? `'${group}' bajado con ${failed.length} error(es)` : `'${group}' bajado`, failed.length ? 'error' : 'ok', 3000);
}

async function restartGroup(group) {
  toast(`Reiniciando '${group}'…`, 'ok', 2500);
  const data = await fetchAPI('POST', `/api/groups/${encodeURIComponent(group)}/restart`);
  await loadProjects();
  showGroupResult(group, data);
}

function showGroupResult(group, data) {
  const urls   = data.urls || [];
  const failed = (data.results || []).filter(r => !r.ok);
  const box = document.getElementById('modal-group-box');
  box.innerHTML = `
    <h3>Grupo '${esc(group)}'</h3>
    <p class="modal-sub">${data.error ? esc(data.error) : 'Backend arrancado primero, frontend después.'}</p>
    ${urls.length ? `
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:${failed.length ? '16px' : '0'}">
        ${urls.map(u => `
          <a href="${esc(u.url)}" target="_blank" style="display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);color:var(--accent);text-decoration:none;font-size:13px">
            <span>${esc(u.name)} <span style="color:var(--muted);font-weight:400">(${esc(u.role || '—')})</span></span>
            <span>${esc(u.url)}</span>
          </a>`).join('')}
      </div>` : `<p style="color:var(--muted);font-size:13px;margin-bottom:${failed.length ? '16px' : '0'}">Ningún servicio quedó escuchando en su puerto.</p>`}
    ${failed.length ? `
      <p style="color:var(--error);font-size:12px;margin-bottom:6px"><strong>Fallaron:</strong></p>
      <ul style="margin:0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.6">
        ${failed.map(f => {
          const c = f.port_conflict;
          const who = c ? (c.project ? `proyecto '${esc(c.project)}'` : (c.process ? `proceso '${esc(c.process)}' (PID ${c.pid})` : `PID ${c.pid}`)) : '';
          return `<li>${esc(f.name)}: ${esc(f.error || 'error desconocido')}
            ${c ? ` — <a href="#" onclick="event.preventDefault(); resolveGroupConflict('${escAttr(group)}', ${JSON.stringify(c).replace(/"/g,'&quot;')})" style="color:var(--accent)">bajar ${who} y reintentar</a>` : ''}</li>`;
        }).join('')}
      </ul>` : ''}
    <div class="modal-actions">
      <button class="btn primary" onclick="closeGroupModal()">Cerrar</button>
    </div>`;
  document.getElementById('modal-group').classList.add('open');
}

async function resolveGroupConflict(group, conflict) {
  await handlePortConflict(conflict, () => startGroup(group));
}

function closeGroupModal() { document.getElementById('modal-group').classList.remove('open'); }

// ── Utilities ──────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g,"\\'");
}
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copiado', 'ok', 1500));
}

// ── Polling ────────────────────────────────────────────────────────────────
setInterval(async () => {
  await loadProjects();
  await loadDbProcesses();
  if (state.selected && state.tab === 'logs') loadLogs(state.selected);
}, 5000);

loadProjects();
loadManagerBadge();
loadDbProcesses();
</script>
